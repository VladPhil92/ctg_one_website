services:
  - type: web
    name: ctg-one-website
    runtime: node
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: NEXT_PUBLIC_SITE_URL
        value: https://ctgone.com
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Canonical server-to-server origin for Nvet Care. This URL is public
      # infrastructure metadata, not a secret. The BFF also carries the same
      # production fallback so a Render environment drift cannot break login.
      - key: CTG_NVETCARE_API_URL
        value: https://backend-production-a476.up.railway.app
      # CTG One Wallet identity + read-only Polygon runtime. Values stay in
      # Render configuration; no provider key, RPC URL or token address is
      # committed to source. Wallet features fail closed while unset.
      - key: NEXT_PUBLIC_PRIVY_APP_ID
        sync: false
      - key: PRIVY_JWT_VERIFICATION_KEY
        sync: false
      - key: POLYGON_RPC_URL
        sync: false
      - key: CTG_TOKEN_POLYGON_ADDRESS
        sync: false
      # Crypto-send execution is server-authoritative and remains disabled in
      # production until an explicitly reviewed canary window is opened.
      - key: WALLET_CRYPTO_SEND_EXECUTION_MODE
        value: "disabled"
      # Canonical Supabase UUID allowlist for the controlled canary. The value
      # is provisioned only in Render and is never committed or browser-public.
      - key: WALLET_CRYPTO_SEND_CANARY_USER_IDS
        sync: false
      # Shared secret for the bounded server-side Polygon reconciliation worker.
      # The matching GitHub Actions repository secret must be provisioned with
      # the exact same value before the scheduled worker becomes operational.
      - key: WALLET_CHAIN_RECONCILIATION_WORKER_SECRET
        sync: false
      # Controlled manual COP top-up rail. The static Bre-B payload is approved
      # public display data. Enabling it exposes payment instructions and claim
      # intake only; KYC, proof validation, independent verification and a second
      # reconciliation step remain mandatory before the canonical ledger changes.
      - key: NEXT_PUBLIC_WALLET_STATIC_BRE_B_ENABLED
        value: "true"
      # Optional conventional bank transfer remains fail-closed until its full
      # public account tuple is independently verified and configured.
      - key: NEXT_PUBLIC_WALLET_BANK_NAME
        sync: false
      - key: NEXT_PUBLIC_WALLET_BANK_ACCOUNT_TYPE
        sync: false
      - key: NEXT_PUBLIC_WALLET_BANK_ACCOUNT_NUMBER
        sync: false
      - key: NEXT_PUBLIC_WALLET_BANK_ACCOUNT_HOLDER
        sync: false
      - key: NEXT_PUBLIC_WALLET_BANK_ACCOUNT_HOLDER_NIT
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: OPENAI_RESPONSE_MODEL
        value: gpt-5-mini