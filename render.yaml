services:
  - type: web
    name: ctg-one-website
    runtime: node
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: NEXT_PUBLIC_SITE_URL
        value: https://ctgone.com
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # CTG One Wallet identity + read-only Polygon runtime. Values stay in
      # Render configuration; no provider key, RPC URL or token address is
      # committed to source. Wallet features fail closed while unset.
      - key: NEXT_PUBLIC_PRIVY_APP_ID
        sync: false
      - key: PRIVY_JWT_VERIFICATION_KEY
        sync: false
      - key: POLYGON_RPC_URL
        sync: false
      - key: CTG_TOKEN_POLYGON_ADDRESS
        sync: false
      # CTG One Wallet manual COP top-up rails. The approved static Bre-B QR
      # and key are immutable public display data versioned in source and need
      # no Bancolombia API or deployment secret. Keep the real-money rail off
      # until the rollout gate is explicitly cleared.
      - key: NEXT_PUBLIC_WALLET_STATIC_BRE_B_ENABLED
        value: "false"
      # Optional conventional bank transfer remains fail-closed until its full
      # public account tuple is independently verified and configured.
      - key: NEXT_PUBLIC_WALLET_BANK_NAME
        sync: false
      - key: NEXT_PUBLIC_WALLET_BANK_ACCOUNT_TYPE
        sync: false
      - key: NEXT_PUBLIC_WALLET_BANK_ACCOUNT_NUMBER
        sync: false
      - key: NEXT_PUBLIC_WALLET_BANK_ACCOUNT_HOLDER
        sync: false
      - key: NEXT_PUBLIC_WALLET_BANK_ACCOUNT_HOLDER_NIT
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: OPENAI_RESPONSE_MODEL
        value: gpt-5-mini