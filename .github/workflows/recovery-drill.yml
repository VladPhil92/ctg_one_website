name: Production Recovery Drill

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RUN_READ_ONLY_RECOVERY_DRILL to confirm a read-only production export and ephemeral local restore'
        required: true
        type: string
      max_storage_objects:
        description: 'Fail closed if source Storage exceeds this object count'
        required: true
        default: '5000'
        type: string
      max_storage_bytes:
        description: 'Fail closed if source Storage exceeds this byte count'
        required: true
        default: '536870912'
        type: string

permissions:
  contents: read

concurrency:
  group: production-recovery-drill
  cancel-in-progress: false

jobs:
  recovery-drill:
    name: Backup, restore and verify production-derived recovery set
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SOURCE_DATABASE_URL: ${{ secrets.RECOVERY_PRODUCTION_DATABASE_URL }}
      SOURCE_SUPABASE_URL: ${{ secrets.RECOVERY_PRODUCTION_SUPABASE_URL }}
      SOURCE_SUPABASE_SECRET_KEY: ${{ secrets.RECOVERY_PRODUCTION_SUPABASE_SECRET_KEY }}
      RECOVERY_STORAGE_MAX_OBJECTS: ${{ github.event.inputs.max_storage_objects }}
      RECOVERY_STORAGE_MAX_BYTES: ${{ github.event.inputs.max_storage_bytes }}
      RECOVERY_DATABASE_SCHEMA_DUMP: .recovery-work/production-schema.sql
      RECOVERY_DATABASE_DATA_DUMP: .recovery-work/production-data.sql
      RECOVERY_SOURCE_DB_EVIDENCE: .recovery-work/source-db.json
      RECOVERY_RESTORED_DB_EVIDENCE: .recovery-work/restored-db.json
      RECOVERY_STORAGE_BACKUP_DIR: .recovery-work/storage
      RECOVERY_STORAGE_EVIDENCE_PATH: .recovery-work/storage-evidence.json
      RECOVERY_EVIDENCE_JSON: .recovery-work/evidence/recovery-drill.json
      RECOVERY_EVIDENCE_MARKDOWN: .recovery-work/evidence/recovery-drill.md
      RECOVERY_TARGET_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      RECOVERY_GITHUB_RUN_ID: ${{ github.run_id }}
      RECOVERY_GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
      RECOVERY_GITHUB_REPOSITORY: ${{ github.repository }}
      RECOVERY_GITHUB_REF: ${{ github.ref }}

    steps:
      - name: Validate explicit authorization and required secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.confirmation }}" != "RUN_READ_ONLY_RECOVERY_DRILL" ]; then
            echo "::error::Explicit recovery-drill confirmation did not match."
            exit 1
          fi
          for name in SOURCE_DATABASE_URL SOURCE_SUPABASE_URL SOURCE_SUPABASE_SECRET_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required GitHub secret for ${name} is not configured."
              exit 1
            fi
          done
          echo "RECOVERY_DRILL_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Checkout dispatched main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Verify exact recovery commit provenance
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [ "$checked_out_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Recovery drill checkout mismatch: expected dispatched SHA $GITHUB_SHA."
            exit 1
          fi
          echo "RECOVERY_CHECKED_OUT_SHA=$checked_out_sha" >> "$GITHUB_ENV"

      - name: Prepare recovery workspace
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .recovery-work/evidence .recovery-work/storage

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.111.0

      - name: Start isolated full local Supabase recovery target
        run: supabase start

      - name: Resolve and mask local recovery credentials
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          : "${API_URL:?Local Supabase API_URL missing}"
          : "${SERVICE_ROLE_KEY:?Local Supabase SERVICE_ROLE_KEY missing}"
          echo "::add-mask::${SERVICE_ROLE_KEY}"
          echo "TARGET_SUPABASE_URL=${API_URL}" >> "$GITHUB_ENV"
          echo "TARGET_SUPABASE_SECRET_KEY=${SERVICE_ROLE_KEY}" >> "$GITHUB_ENV"

      - name: Capture redacted source snapshot
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e DATABASE_URL="$SOURCE_DATABASE_URL" \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            postgres:17 \
            sh -ceu 'psql "$DATABASE_URL" -X -qAt -v ON_ERROR_STOP=1 -f /repo/scripts/recovery-database-snapshot.sql' \
            > "$RECOVERY_SOURCE_DB_EVIDENCE"
          jq -e '.migrationCount >= 1 and (.latestMigration | type == "string")' "$RECOVERY_SOURCE_DB_EVIDENCE" >/dev/null

      - name: Create Supabase-aware ephemeral production database backup
        shell: bash
        run: |
          set -euo pipefail
          supabase db dump \
            --db-url "$SOURCE_DATABASE_URL" \
            --file "$RECOVERY_DATABASE_SCHEMA_DUMP"
          # Storage is intentionally excluded from the SQL data restore. Hosted
          # Storage metadata can run a newer managed schema than the pinned local
          # stack, while bucket configuration and object bytes are already restored
          # and checksum-verified later through the loopback Storage API.
          supabase db dump \
            --db-url "$SOURCE_DATABASE_URL" \
            --file "$RECOVERY_DATABASE_DATA_DUMP" \
            --data-only \
            --use-copy \
            -x 'storage.*'
          test -s "$RECOVERY_DATABASE_SCHEMA_DUMP"
          test -s "$RECOVERY_DATABASE_DATA_DUMP"

      - name: Verify isolated local transactional state before normalization
        shell: bash
        run: |
          set -euo pipefail
          psql "$RECOVERY_TARGET_DATABASE_URL" \
            -X -qAt -v ON_ERROR_STOP=1 \
            -f scripts/recovery-database-snapshot.sql \
            > .recovery-work/pre-normalize-db.json
          jq -e '
            .authUsers == 0 and
            .profiles == 0 and
            .wallets == 0 and
            .transactions == 0 and
            .kycSubmissions == 0 and
            .kycDocuments == 0 and
            .adminAuditEntries == 0 and
            .storageObjectMetadata == 0 and
            .investmentParticipantProfiles == 0 and
            .investmentLots == 0 and
            .investmentOrders == 0 and
            .investmentFundingAllocations == 0 and
            .investmentPaymentReceipts == 0 and
            .investmentLedgerEntries == 0 and
            .investmentSettlements == 0 and
            .investmentSales == 0 and
            .investmentBottleUnits == 0 and
            .investmentWithdrawalRequests == 0 and
            .investmentReinvestmentRequests == 0 and
            .investmentPayouts == 0 and
            .investmentPayoutEvents == 0 and
            .investmentAuditEntries == 0 and
            .domainEvents == 0 and
            .notificationDeliveries == 0 and
            .notificationDeliveryAttempts == 0 and
            .documentJobs == 0 and
            .migrationCount >= 1 and
            (.latestMigration | type == "string")
          ' .recovery-work/pre-normalize-db.json >/dev/null

      - name: Normalize migration-materialized data on isolated local target
        shell: bash
        run: |
          set -euo pipefail
          expected_target='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          if [ "$RECOVERY_TARGET_DATABASE_URL" != "$expected_target" ]; then
            echo "::error::Recovery normalization is allowed only on the exact loopback Supabase database target."
            exit 1
          fi
          psql "$RECOVERY_TARGET_DATABASE_URL" \
            -X -v ON_ERROR_STOP=1 \
            --command "SET ctg.recovery_target = 'local-ephemeral-supabase'" \
            --file scripts/recovery-normalize-local-data.sql

      - name: Verify normalized local data baseline
        shell: bash
        run: |
          set -euo pipefail
          psql "$RECOVERY_TARGET_DATABASE_URL" \
            -X -qAt -v ON_ERROR_STOP=1 \
            -f scripts/recovery-database-snapshot.sql \
            > .recovery-work/normalized-db.json
          jq -e '
            .authUsers == 0 and
            .profiles == 0 and
            .wallets == 0 and
            .transactions == 0 and
            .kycSubmissions == 0 and
            .kycDocuments == 0 and
            .adminAuditEntries == 0 and
            .storageObjectMetadata == 0 and
            .investmentParticipantProfiles == 0 and
            .investmentFormulaVersions == 0 and
            .investmentBeerStyles == 0 and
            .investmentLots == 0 and
            .investmentOrders == 0 and
            .investmentFundingAllocations == 0 and
            .investmentPaymentReceipts == 0 and
            .investmentLedgerEntries == 0 and
            .investmentSettlements == 0 and
            .investmentSales == 0 and
            .investmentBottleUnits == 0 and
            .investmentWithdrawalRequests == 0 and
            .investmentReinvestmentRequests == 0 and
            .investmentPayouts == 0 and
            .investmentPayoutEvents == 0 and
            .investmentAuditEntries == 0 and
            .domainEvents == 0 and
            .notificationTemplates == 0 and
            .notificationDeliveries == 0 and
            .notificationDeliveryAttempts == 0 and
            .documentJobs == 0 and
            .migrationCount >= 1 and
            (.latestMigration | type == "string")
          ' .recovery-work/normalized-db.json >/dev/null

      - name: Restore production data into isolated local Supabase database
        shell: bash
        run: |
          set -euo pipefail
          psql "$RECOVERY_TARGET_DATABASE_URL" \
            --single-transaction \
            --variable ON_ERROR_STOP=1 \
            --command 'SET session_replication_role = replica' \
            --file "$RECOVERY_DATABASE_DATA_DUMP"

      - name: Compare restored database facts
        shell: bash
        run: |
          set -euo pipefail
          psql "$RECOVERY_TARGET_DATABASE_URL" \
            -X -qAt -v ON_ERROR_STOP=1 \
            -f scripts/recovery-database-snapshot.sql \
            > "$RECOVERY_RESTORED_DB_EVIDENCE"
          # Storage metadata is reconciled later by the byte-level Storage drill.
          jq -S 'del(.snapshotAt, .storageObjectMetadata)' "$RECOVERY_SOURCE_DB_EVIDENCE" > .recovery-work/source-counts.json
          jq -S 'del(.snapshotAt, .storageObjectMetadata)' "$RECOVERY_RESTORED_DB_EVIDENCE" > .recovery-work/restored-counts.json
          diff -u .recovery-work/source-counts.json .recovery-work/restored-counts.json

      - name: Run Golden Path and security contracts on restored database
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            scripts/golden-path-schema-smoke.sql \
            scripts/golden-path-transactional-smoke.sql \
            scripts/kyc-resilience-schema-smoke.sql \
            scripts/http-security-schema-smoke.sql \
            scripts/security-definer-exposure-smoke.sql \
            scripts/domain-event-outbox-schema-smoke.sql \
            scripts/document-notification-os-schema-smoke.sql \
            scripts/operations-intelligence-schema-smoke.sql; do
            psql "$RECOVERY_TARGET_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$script"
          done

      - name: Backup and restore actual Storage object bytes
        run: node scripts/recovery-storage-drill.mjs

      - name: Compile redacted recovery evidence
        run: node scripts/compile-recovery-evidence.mjs

      - name: Upload redacted recovery evidence only
        uses: actions/upload-artifact@v7
        with:
          name: recovery-drill-evidence-${{ github.run_id }}
          path: |
            .recovery-work/evidence/recovery-drill.json
            .recovery-work/evidence/recovery-drill.md
          if-no-files-found: error
          retention-days: 30

      - name: Destroy ephemeral recovery material
        if: always()
        shell: bash
        run: |
          set +e
          supabase stop --no-backup
          rm -rf .recovery-work
