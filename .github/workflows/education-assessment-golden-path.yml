name: Education Assessment Golden Path

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: education-assessment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assessment-golden-path:
    name: Assessment scoring and evidence contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.111.0

      - name: Apply all migrations to fresh local Postgres
        run: supabase db start

      - name: Run Education Assessment Golden Journey
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f scripts/education-assessment-golden-journey.sql
