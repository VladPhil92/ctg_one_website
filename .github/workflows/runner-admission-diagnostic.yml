name: Runner Admission Diagnostic

on:
  push:
    branches: [phase/blockchain-portfolio-parity]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slim:
    name: ubuntu-slim admission
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Prove runner admission
        run: |
          echo "runner=${RUNNER_NAME}"
          echo "os=${RUNNER_OS}"
          uname -a

  ubuntu2404:
    name: ubuntu-24.04 admission
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Prove runner admission
        run: |
          echo "runner=${RUNNER_NAME}"
          echo "os=${RUNNER_OS}"
          uname -a
