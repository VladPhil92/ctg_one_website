name: SLSA provenance (disabled until release artifacts are defined)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Explain status
        run: |
          echo "SLSA provenance generation is intentionally disabled for automatic release events."
          echo "The previous workflow generated placeholder artifacts rather than real CTG One release artifacts."
          echo "Re-enable provenance only after the project defines concrete release artifacts and their digest inputs."
