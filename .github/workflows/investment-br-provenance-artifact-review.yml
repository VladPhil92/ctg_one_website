name: Investment BR Provenance Artifact Review

on:
  workflow_dispatch:
    inputs:
      provenance_run_id:
        description: 'Successful Investment BR Merged-Main Provenance run id'
        required: true
        type: string
      provenance_artifact_id:
        description: 'Exact provenance artifact id from that run'
        required: true
        type: string
      provenance_artifact_digest:
        description: 'Exact GitHub artifact digest, including sha256: prefix'
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: investment-br-provenance-review-${{ inputs.provenance_run_id }}-${{ inputs.provenance_artifact_id }}
  cancel-in-progress: false

jobs:
  technical-review:
    name: Verify provenance artifact transport
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BR_REVIEW_OUTPUT_PATH: provenance-review/investment-business-rule-provenance-artifact-review.json
      BR_HUMAN_REVIEW_TEMPLATE_PATH: provenance-review/investment-business-rule-provenance-human-review.json

    steps:
      - name: Checkout trusted review tooling from main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0

      - name: Verify trusted review context and inputs
        shell: bash
        env:
          INPUT_RUN_ID: ${{ inputs.provenance_run_id }}
          INPUT_ARTIFACT_ID: ${{ inputs.provenance_artifact_id }}
          INPUT_ARTIFACT_DIGEST: ${{ inputs.provenance_artifact_digest }}
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS}" = 'true'
          test "${GITHUB_EVENT_NAME}" = 'workflow_dispatch'
          test "${GITHUB_REF}" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          [[ "${INPUT_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${INPUT_ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${INPUT_ARTIFACT_DIGEST}" =~ ^sha256:[0-9a-fA-F]{64}$ ]]

          echo "BR_REVIEW_EXPECTED_SOURCE_RUN_ID=${INPUT_RUN_ID}" >> "${GITHUB_ENV}"
          echo "BR_REVIEW_EXPECTED_ARTIFACT_ID=${INPUT_ARTIFACT_ID}" >> "${GITHUB_ENV}"
          echo "BR_REVIEW_EXPECTED_ARTIFACT_DIGEST=$(printf '%s' "${INPUT_ARTIFACT_DIGEST}" | tr '[:upper:]' '[:lower:]')" >> "${GITHUB_ENV}"

      - name: Resolve source run and artifact from GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_path="${RUNNER_TEMP}/investment-br-provenance-source-run.json"
          artifact_path="${RUNNER_TEMP}/investment-br-provenance-source-artifact.json"

          curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${BR_REVIEW_EXPECTED_SOURCE_RUN_ID}" \
            > "${run_path}"

          jq -e \
            --argjson run_id "${BR_REVIEW_EXPECTED_SOURCE_RUN_ID}" \
            '.id == $run_id
              and .name == "Investment BR Merged-Main Provenance"
              and .path == ".github/workflows/investment-br-merged-main-provenance.yml"
              and .event == "push"
              and .status == "completed"
              and .conclusion == "success"
              and .head_branch == "main"
              and .repository.full_name == "VladPhil92/ctg_one_website"
              and .head_repository.full_name == "VladPhil92/ctg_one_website"' \
            "${run_path}" >/dev/null

          curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BR_REVIEW_EXPECTED_ARTIFACT_ID}" \
            > "${artifact_path}"

          source_sha="$(jq -r '.head_sha' "${run_path}")"
          expected_name="investment-br-main-provenance-${source_sha}"
          jq -e \
            --argjson artifact_id "${BR_REVIEW_EXPECTED_ARTIFACT_ID}" \
            --argjson run_id "${BR_REVIEW_EXPECTED_SOURCE_RUN_ID}" \
            --arg name "${expected_name}" \
            --arg sha "${source_sha}" \
            --arg digest "${BR_REVIEW_EXPECTED_ARTIFACT_DIGEST}" \
            '.id == $artifact_id
              and .name == $name
              and .expired == false
              and .digest == $digest
              and .workflow_run.id == $run_id
              and .workflow_run.head_branch == "main"
              and .workflow_run.head_sha == $sha' \
            "${artifact_path}" >/dev/null

          echo "BR_REVIEW_SOURCE_RUN_METADATA_PATH=${run_path}" >> "${GITHUB_ENV}"
          echo "BR_REVIEW_SOURCE_ARTIFACT_METADATA_PATH=${artifact_path}" >> "${GITHUB_ENV}"
          echo "BR_REVIEW_SOURCE_SHA=${source_sha}" >> "${GITHUB_ENV}"

      - name: Download and hash exact provenance artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive_path="${RUNNER_TEMP}/investment-br-provenance-source.zip"
          evidence_path="${RUNNER_TEMP}/investment-business-rule-main-provenance.json"

          curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BR_REVIEW_EXPECTED_ARTIFACT_ID}/zip" \
            > "${archive_path}"

          archive_digest="sha256:$(sha256sum "${archive_path}" | awk '{print $1}')"
          api_digest="$(jq -r '.digest' "${BR_REVIEW_SOURCE_ARTIFACT_METADATA_PATH}")"
          test "${archive_digest}" = "${api_digest}"
          test "${archive_digest}" = "${BR_REVIEW_EXPECTED_ARTIFACT_DIGEST}"

          entry_count="$(unzip -Z1 "${archive_path}" | wc -l | tr -d ' ')"
          test "${entry_count}" = '1'
          test "$(unzip -Z1 "${archive_path}")" = 'investment-business-rule-main-provenance.json'
          unzip -p "${archive_path}" investment-business-rule-main-provenance.json > "${evidence_path}"
          test -s "${evidence_path}"

          echo "BR_REVIEW_DOWNLOADED_ARCHIVE_DIGEST=${archive_digest}" >> "${GITHUB_ENV}"
          echo "BR_REVIEW_SOURCE_EVIDENCE_PATH=${evidence_path}" >> "${GITHUB_ENV}"

      - name: Validate source provenance evidence contract
        run: node scripts/validate-investment-business-rule-main-provenance-evidence.mjs "${BR_REVIEW_SOURCE_EVIDENCE_PATH}"

      - name: Independently re-verify source merge transition and Git blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evidence="${BR_REVIEW_SOURCE_EVIDENCE_PATH}"
          trusted_sha="$(jq -r '.trustedMainSha' "${evidence}")"
          before_sha="$(jq -r '.transition.beforeSha' "${evidence}")"
          first_parent_evidence="$(jq -r '.transition.firstParentSha' "${evidence}")"
          second_parent_evidence="$(jq -r '.transition.secondParentSha' "${evidence}")"
          pr_number="$(jq -r '.mergePullRequest.number' "${evidence}")"
          governance_blob_evidence="$(jq -r '.governance.blobSha' "${evidence}")"

          test "${trusted_sha}" = "${BR_REVIEW_SOURCE_SHA}"
          git cat-file -e "${trusted_sha}^{commit}"
          git merge-base --is-ancestor "${trusted_sha}" HEAD

          commit_path="${RUNNER_TEMP}/investment-br-provenance-source-commit.json"
          pr_path="${RUNNER_TEMP}/investment-br-provenance-source-pr.json"

          curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${trusted_sha}" \
            > "${commit_path}"

          jq -e --arg sha "${trusted_sha}" \
            '.sha == $sha and .commit.verification.verified == true and (.parents | length) == 2' \
            "${commit_path}" >/dev/null
          first_parent="$(jq -r '.parents[0].sha' "${commit_path}")"
          second_parent="$(jq -r '.parents[1].sha' "${commit_path}")"
          test "${first_parent}" = "${before_sha}"
          test "${first_parent}" = "${first_parent_evidence}"
          test "${second_parent}" = "${second_parent_evidence}"

          curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" \
            > "${pr_path}"

          jq -e \
            --arg sha "${trusted_sha}" \
            --arg before "${before_sha}" \
            --arg second "${second_parent}" \
            '.merged_at != null
              and .base.ref == "main"
              and .base.sha == $before
              and .head.sha == $second
              and .merge_commit_sha == $sha' \
            "${pr_path}" >/dev/null

          governance_blob_actual="$(git rev-parse "${trusted_sha}:src/data/investment-business-rule-governance.mjs")"
          test "${governance_blob_actual}" = "${governance_blob_evidence}"

          candidate_json="$(node --input-type=module -e "import { INVESTMENT_BUSINESS_RULE_IMMUTABLE_CANDIDATE as c } from './src/data/investment-business-rule-candidate-authority.mjs'; process.stdout.write(JSON.stringify(c));")"
          candidate_commit="$(printf '%s' "${candidate_json}" | jq -r '.commit')"
          candidate_path="$(printf '%s' "${candidate_json}" | jq -r '.path')"
          candidate_blob="$(printf '%s' "${candidate_json}" | jq -r '.blobSha')"
          test "$(git rev-parse "${candidate_commit}:${candidate_path}")" = "${candidate_blob}"
          test "$(jq -r '.candidate.blobSha' "${evidence}")" = "${candidate_blob}"

      - name: Create technical review envelope
        run: node scripts/create-investment-business-rule-provenance-artifact-review.mjs

      - name: Validate technical review envelope
        run: node scripts/validate-investment-business-rule-provenance-artifact-review.mjs "${BR_REVIEW_OUTPUT_PATH}"

      - name: Archive technical review evidence
        id: technical-review-artifact
        uses: actions/upload-artifact@v7
        with:
          name: investment-br-provenance-technical-review-${{ inputs.provenance_run_id }}-${{ inputs.provenance_artifact_id }}
          path: provenance-review/investment-business-rule-provenance-artifact-review.json
          if-no-files-found: error
          retention-days: 30

      - name: Create pending human-review template bound to technical artifact
        env:
          BR_REVIEW_TECHNICAL_ARTIFACT_ID: ${{ steps.technical-review-artifact.outputs.artifact-id }}
          BR_REVIEW_TECHNICAL_ARTIFACT_NAME: investment-br-provenance-technical-review-${{ inputs.provenance_run_id }}-${{ inputs.provenance_artifact_id }}
          BR_REVIEW_TECHNICAL_ARTIFACT_DIGEST: sha256:${{ steps.technical-review-artifact.outputs.artifact-digest }}
        run: node scripts/create-investment-business-rule-provenance-human-review-template.mjs "${BR_REVIEW_OUTPUT_PATH}"

      - name: Validate pending human-review template
        run: node scripts/validate-investment-business-rule-provenance-human-review.mjs "${BR_REVIEW_OUTPUT_PATH}" "${BR_HUMAN_REVIEW_TEMPLATE_PATH}"

      - name: Archive pending human-review template
        id: human-review-template-artifact
        uses: actions/upload-artifact@v7
        with:
          name: investment-br-provenance-human-review-template-${{ inputs.provenance_run_id }}-${{ inputs.provenance_artifact_id }}
          path: provenance-review/investment-business-rule-provenance-human-review.json
          if-no-files-found: error
          retention-days: 30

      - name: Summarize review boundary
        shell: bash
        env:
          TECHNICAL_ARTIFACT_ID: ${{ steps.technical-review-artifact.outputs.artifact-id }}
          TECHNICAL_ARTIFACT_DIGEST: ${{ steps.technical-review-artifact.outputs.artifact-digest }}
          HUMAN_TEMPLATE_ARTIFACT_ID: ${{ steps.human-review-template-artifact.outputs.artifact-id }}
          HUMAN_TEMPLATE_ARTIFACT_DIGEST: ${{ steps.human-review-template-artifact.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          {
            echo '## Investment BR provenance artifact review'
            echo
            jq -r '"- Technical status: `\(.technicalReview.status)`\n- Source main SHA: `\(.technicalReview.source.trustedMainSha)`\n- Source provenance run: `\(.technicalReview.workflow.runId)`\n- Source provenance artifact: `\(.technicalReview.artifact.id)`\n- Source archive digest verified: `\(.technicalReview.downloadedArchiveDigestVerified)`\n- Human review required: `\(.humanReviewRequired)`\n- Implementation PR eligible: `\(.implementationPrEligible)`\n- LIVE promotion allowed: `\(.livePromotionAllowed)`"' "${BR_REVIEW_OUTPUT_PATH}"
            echo "- Technical review artifact ID: \`${TECHNICAL_ARTIFACT_ID}\`"
            echo "- Technical review artifact digest: \`sha256:${TECHNICAL_ARTIFACT_DIGEST}\`"
            echo "- Human-review template artifact ID: \`${HUMAN_TEMPLATE_ARTIFACT_ID}\`"
            echo "- Human-review template artifact digest: \`sha256:${HUMAN_TEMPLATE_ARTIFACT_DIGEST}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
