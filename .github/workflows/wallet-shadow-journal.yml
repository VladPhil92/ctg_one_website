name: Wallet Shadow Journal Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**wallet_shadow_journal**'
      - 'src/lib/wallet/shadow-journal.ts'
      - 'src/lib/observability/schema-version.ts'
      - 'scripts/test-wallet-shadow-journal-invariants.mjs'
      - 'scripts/wallet-shadow-journal-smoke.sql'
      - 'scripts/wallet-domain-v2-schema-smoke.sql'
      - 'scripts/fixtures/investment-operating-evidence.synthetic-v1.json'
      - 'scripts/fixtures/investment-production-readiness-canary.synthetic-v1.json'
      - '.github/workflows/wallet-shadow-journal.yml'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**wallet_shadow_journal**'
      - 'src/lib/wallet/shadow-journal.ts'
      - 'src/lib/observability/schema-version.ts'
      - 'scripts/test-wallet-shadow-journal-invariants.mjs'
      - 'scripts/wallet-shadow-journal-smoke.sql'
      - 'scripts/wallet-domain-v2-schema-smoke.sql'
      - 'scripts/fixtures/investment-operating-evidence.synthetic-v1.json'
      - 'scripts/fixtures/investment-production-readiness-canary.synthetic-v1.json'
      - '.github/workflows/wallet-shadow-journal.yml'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: wallet-shadow-journal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shadow-journal-contract:
    name: Shadow journal reconciliation contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify wallet shadow invariants
        run: |
          node scripts/test-migration-integrity.mjs
          node scripts/test-wallet-domain-v2-invariants.mjs
          node scripts/test-wallet-shadow-journal-invariants.mjs

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.111.0

      - name: Configure isolated database port
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/config.toml')
          source = path.read_text()
          marker = '[db]\n# Port to use for the local database URL.\nport = 54322'
          replacement = '[db]\n# Port to use for the local database URL.\nport = 55436'
          if marker not in source:
              raise SystemExit('Expected Supabase database port stanza was not found')
          path.write_text(source.replace(marker, replacement, 1))
          PY

      - name: Start isolated Supabase database
        run: supabase db start

      - name: Shadow journal PostgreSQL contract
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:55436/postgres" \
            -X -v ON_ERROR_STOP=1 \
            -f scripts/wallet-shadow-journal-smoke.sql
