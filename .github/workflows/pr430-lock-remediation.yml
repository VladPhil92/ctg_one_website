name: PR430 Lock Remediation

on:
  push:
    branches:
      - feat/jpvalderrama-colombia-bilingue
    paths:
      - .github/workflows/pr430-lock-remediation.yml

permissions:
  contents: read

jobs:
  regenerate-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install current lock
        run: npm ci

      - name: Upgrade patched Next.js
        run: npm install --save-exact next@16.3.4

      - name: Apply non-breaking audit remediations
        run: npm audit fix

      - name: Enforce production audit gate
        run: npm audit --omit=dev --audit-level=high

      - name: Upload regenerated manifests
        uses: actions/upload-artifact@v7
        with:
          name: pr430-remediated-package-lock
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1
