name: PR430 Lock Remediation

on:
  push:
    branches:
      - feat/jpvalderrama-colombia-bilingue
    paths:
      - .github/workflows/pr430-lock-remediation.yml

permissions:
  contents: write

jobs:
  regenerate-and-commit-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: feat/jpvalderrama-colombia-bilingue

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install current lock
        run: npm ci

      - name: Upgrade patched Next.js
        run: npm install --save-exact next@16.3.4

      - name: Apply non-breaking audit remediations
        run: npm audit fix

      - name: Enforce production audit gate
        run: npm audit --omit=dev --audit-level=high

      - name: Commit remediated manifests and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git rm .github/workflows/pr430-lock-remediation.yml
          git commit -m "fix(ci): remediate production dependency advisories"
          git push origin HEAD:feat/jpvalderrama-colombia-bilingue
