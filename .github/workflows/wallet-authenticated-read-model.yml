name: Wallet Authenticated Read Model

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/app/api/wallet/overview/**'
      - 'src/lib/wallet/domain.ts'
      - 'src/lib/wallet/read-model.ts'
      - 'src/lib/observability/schema-version.ts'
      - 'scripts/test-wallet-authenticated-read-model-invariants.mjs'
      - '.github/workflows/wallet-authenticated-read-model.yml'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'src/app/api/wallet/overview/**'
      - 'src/lib/wallet/domain.ts'
      - 'src/lib/wallet/read-model.ts'
      - 'src/lib/observability/schema-version.ts'
      - 'scripts/test-wallet-authenticated-read-model-invariants.mjs'
      - '.github/workflows/wallet-authenticated-read-model.yml'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: wallet-authenticated-read-model-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authenticated-read-model:
    name: Authenticated wallet read-model contract
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify wallet read-only invariants
        run: |
          node scripts/test-migration-integrity.mjs
          node scripts/test-wallet-unification-invariants.mjs
          node scripts/test-wallet-trusted-identity-invariants.mjs
          node scripts/test-wallet-domain-v2-invariants.mjs
          node scripts/test-wallet-authenticated-read-model-invariants.mjs

      - name: Typecheck authenticated read model
        run: npx tsc --noEmit

      - name: Build Next.js application
        run: npm run build
