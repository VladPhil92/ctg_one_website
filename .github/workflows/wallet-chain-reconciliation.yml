name: Wallet Chain Reconciliation Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**wallet_chain_reconciliation**'
      - 'supabase/migrations/**wallet_canary_execution_guardrails**'
      - 'src/app/api/wallet/intents/**/authorize/**'
      - 'src/app/api/wallet/intents/**/submit/**'
      - 'src/app/api/wallet/intents/**/reconcile/**'
      - 'src/app/api/wallet/canary/preflight/**'
      - 'src/lib/wallet/chain-reconciliation.ts'
      - 'src/lib/wallet/execution-rollout.ts'
      - 'src/lib/wallet/canary-preflight.ts'
      - 'src/lib/wallet/trusted-simulation.ts'
      - 'src/lib/observability/schema-version.ts'
      - 'scripts/test-wallet-chain-reconciliation-invariants.mjs'
      - 'scripts/test-wallet-canary-rollout-invariants.mjs'
      - 'scripts/wallet-chain-reconciliation-schema-smoke.sql'
      - 'scripts/fixtures/investment-operating-evidence.synthetic-v1.json'
      - 'scripts/fixtures/investment-production-readiness-canary.synthetic-v1.json'
      - 'scripts/fixtures/investment-closed-beta-pilot.synthetic-v1.json'
      - '.github/workflows/wallet-chain-reconciliation.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**wallet_chain_reconciliation**'
      - 'supabase/migrations/**wallet_canary_execution_guardrails**'
      - 'src/app/api/wallet/intents/**/authorize/**'
      - 'src/app/api/wallet/intents/**/submit/**'
      - 'src/app/api/wallet/intents/**/reconcile/**'
      - 'src/app/api/wallet/canary/preflight/**'
      - 'src/lib/wallet/chain-reconciliation.ts'
      - 'src/lib/wallet/execution-rollout.ts'
      - 'src/lib/wallet/canary-preflight.ts'
      - 'src/lib/wallet/trusted-simulation.ts'
      - 'src/lib/observability/schema-version.ts'
      - 'scripts/test-wallet-chain-reconciliation-invariants.mjs'
      - 'scripts/test-wallet-canary-rollout-invariants.mjs'
      - 'scripts/wallet-chain-reconciliation-schema-smoke.sql'
      - '.github/workflows/wallet-chain-reconciliation.yml'

permissions:
  contents: read

concurrency:
  group: wallet-chain-reconciliation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wallet-chain-reconciliation:
    name: Wallet chain submission/reconciliation contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify static chain trust-boundary invariants
        run: |
          node scripts/test-migration-integrity.mjs
          node scripts/test-wallet-chain-reconciliation-invariants.mjs
          node scripts/test-wallet-canary-rollout-invariants.mjs

      - name: Typecheck chain lifecycle
        run: npx tsc --noEmit

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.111.0

      - name: Start isolated Supabase database
        run: supabase db start

      - name: Wallet chain reconciliation PostgreSQL contract
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f scripts/wallet-chain-reconciliation-schema-smoke.sql
