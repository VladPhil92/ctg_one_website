name: Required Main Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: required-main-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required:
    name: Test, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
