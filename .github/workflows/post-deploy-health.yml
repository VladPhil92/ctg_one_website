name: Post-Deploy Health Canary

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Full 40-character Git SHA expected in Render'
        required: false
        type: string
      health_url:
        description: 'Health endpoint to verify; Investment probes derive from the same origin; Wallet CORS probe uses the same origin'
        required: false
        default: 'https://ctgone.com/api/health'
        type: string

permissions:
  contents: read

concurrency:
  group: post-deploy-health-main
  cancel-in-progress: true

jobs:
  production-canary:
    name: Verify Render commit, Wallet origin and Investment readiness
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HEALTH_URL: ${{ github.event.inputs.health_url || 'https://ctgone.com/api/health' }}
      EXPECTED_DEPLOYMENT_SHA: ${{ github.event.inputs.expected_sha || github.sha }}
      EXPECTED_DEPLOYMENT_BRANCH: main
      CANARY_ATTEMPTS: '24'
      CANARY_INTERVAL_MS: '25000'
      CANARY_REQUEST_TIMEOUT_MS: '10000'
      WALLET_CLIENT_ORIGIN: https://ctg-one-wallet.vercel.app
      WALLET_ORIGIN_CANARY_REQUEST_TIMEOUT_MS: '10000'
      INVESTMENT_CANARY_ATTEMPTS: '3'
      INVESTMENT_CANARY_INTERVAL_MS: '5000'
      INVESTMENT_CANARY_EVIDENCE_PATH: canary-evidence/investment-production-readiness.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.expected_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0

      - name: Verify production deployment identity
        run: node scripts/verify-deployment-health.mjs

      - name: Verify CTG Wallet production-origin CORS contract
        run: node scripts/verify-wallet-production-origin.mjs

      - name: Verify Investment production readiness
        if: always()
        id: investment-canary
        run: node scripts/verify-investment-production-readiness.mjs

      - name: Archive Investment readiness evidence
        if: always() && steps.investment-canary.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: investment-production-readiness-${{ github.event.inputs.expected_sha || github.sha }}
          path: canary-evidence/investment-production-readiness.json
          if-no-files-found: error
          retention-days: 14
