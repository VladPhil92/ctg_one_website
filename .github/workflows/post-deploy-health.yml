name: Post-Deploy Health Canary

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Full 40-character Git SHA expected in Render; omit to verify the currently live Render release'
        required: false
        type: string
      health_url:
        description: 'Health endpoint to verify; Investment probes derive from the same origin; public and Wallet probes use that origin too'
        required: false
        default: 'https://ctgone.com/api/health'
        type: string

permissions:
  contents: read

concurrency:
  group: post-deploy-health-main
  cancel-in-progress: true

jobs:
  production-canary:
    name: Verify Render commit, public surfaces, Wallet origin and Investment readiness
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HEALTH_URL: ${{ github.event.inputs.health_url || 'https://ctgone.com/api/health' }}
      EXPECTED_DEPLOYMENT_BRANCH: main
      CANARY_ATTEMPTS: '24'
      CANARY_INTERVAL_MS: '25000'
      CANARY_REQUEST_TIMEOUT_MS: '10000'
      PUBLIC_SURFACE_CANARY_REQUEST_TIMEOUT_MS: '10000'
      WALLET_CLIENT_ORIGIN: https://wallet.ctgone.com
      WALLET_ORIGIN_CANARY_REQUEST_TIMEOUT_MS: '10000'
      INVESTMENT_CANARY_ATTEMPTS: '3'
      INVESTMENT_CANARY_INTERVAL_MS: '5000'
      INVESTMENT_CANARY_EVIDENCE_PATH: canary-evidence/investment-production-readiness.json

    steps:
      - name: Resolve deployment target
        id: target
        shell: bash
        env:
          REQUESTED_SHA: ${{ github.event.inputs.expected_sha || '' }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_SHA" ]]; then
            TARGET_SHA="$REQUESTED_SHA"
            MODE="strict-requested-sha"
          else
            BODY="$(curl --fail --silent --show-error \
              --connect-timeout 10 --max-time 15 \
              -H 'Accept: application/json' \
              -H 'Cache-Control: no-cache' \
              -H 'User-Agent: ctg-one-post-deploy-target-resolver/1.0' \
              "$HEALTH_URL")"
            TARGET_SHA="$(node -e 'const body=JSON.parse(process.argv[1]); const sha=body?.deployment?.commit; if (typeof sha !== "string") process.exit(2); process.stdout.write(sha);' "$BODY")"
            MODE="live-release"
          fi

          if [[ ! "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Resolved deployment SHA is invalid" >&2
            exit 1
          fi

          echo "sha=${TARGET_SHA,,}" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Resolved canary target mode=$MODE sha=${TARGET_SHA,,}"

      - name: Checkout deployment release
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0

      - name: Verify production deployment identity
        env:
          EXPECTED_DEPLOYMENT_SHA: ${{ steps.target.outputs.sha }}
        run: node scripts/verify-deployment-health.mjs

      - name: Verify public surface reliability
        run: node scripts/verify-public-surface-reliability.mjs

      - name: Verify CTG Wallet production-origin CORS contract
        run: node scripts/verify-wallet-production-origin.mjs

      - name: Verify Investment production readiness
        if: always()
        id: investment-canary
        env:
          EXPECTED_DEPLOYMENT_SHA: ${{ steps.target.outputs.sha }}
        run: node scripts/verify-investment-production-readiness.mjs

      - name: Archive Investment readiness evidence
        if: always() && steps.investment-canary.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: investment-production-readiness-${{ steps.target.outputs.sha }}
          path: canary-evidence/investment-production-readiness.json
          if-no-files-found: error
          retention-days: 14
