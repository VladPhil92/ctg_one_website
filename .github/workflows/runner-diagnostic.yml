name: Runner Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ubuntu-latest:
    name: Diagnostic ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Runner acquired
        run: echo "ubuntu-latest runner acquired"

  ubuntu-2404:
    name: Diagnostic ubuntu-24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Runner acquired
        run: echo "ubuntu-24.04 runner acquired"

  windows-latest:
    name: Diagnostic windows-latest
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Runner acquired
        run: Write-Output "windows-latest runner acquired"

  macos-latest:
    name: Diagnostic macos-latest
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Runner acquired
        run: echo "macos-latest runner acquired"
