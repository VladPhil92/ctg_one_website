name: Wallet Chain Reconciliation Worker

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wallet-chain-reconciliation-production-worker
  cancel-in-progress: false

jobs:
  invoke-production-worker:
    name: Reconcile submitted Polygon intents
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WORKER_URL: https://ctgone.com/api/internal/wallet/reconcile-pending
      WORKER_SECRET: ${{ secrets.WALLET_CHAIN_RECONCILIATION_WORKER_SECRET }}

    steps:
      - name: Fail closed when worker credential is not provisioned
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${WORKER_SECRET}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Wallet chain reconciliation worker is not provisioned; scheduled production invocation remains disabled."
            exit 0
          fi
          if [ "${#WORKER_SECRET}" -lt 32 ]; then
            echo "::error::WALLET_CHAIN_RECONCILIATION_WORKER_SECRET must contain at least 32 characters."
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Invoke bounded production reconciliation batch
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          request_id="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          status="$(curl \
            --silent \
            --show-error \
            --output "$body_file" \
            --write-out '%{http_code}' \
            --request POST \
            --connect-timeout 10 \
            --max-time 120 \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --header "X-Request-ID: ${request_id}" \
            --header "X-CTG-Wallet-Worker-Secret: ${WORKER_SECRET}" \
            --data '{"version":"ctg-wallet-chain-worker-v1"}' \
            "$WORKER_URL")"

          cat "$body_file"
          echo
          test "$status" = '200'
          jq -e '
            .version == "ctg-wallet-chain-worker-v1" and
            (.counts.scanned | type == "number") and
            (.counts.errors | type == "number") and
            (.counts.stuck | type == "number") and
            (.durationMs | type == "number")
          ' "$body_file" >/dev/null
