name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Application quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Enforce PR-only changes to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/commits/${SHA}/pulls")"
          merged_prs="$(printf '%s' "$response" | jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length')"
          if [ "$merged_prs" -lt 1 ]; then
            echo "::error::Direct pushes to main are prohibited. Open a pull request and merge it after CI passes."
            exit 1
          fi
          echo "Main commit is associated with a merged pull request."

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Critical safety invariants
        run: npm test

      - name: Production dependency audit
        run: npm run audit:critical

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build Next.js application
        run: npm run build

      - name: Install pinned Playwright test runtime
        run: npm install --no-save --package-lock=false @playwright/test@1.62.0

      - name: Verify runner Chrome availability
        run: google-chrome --version

      - name: Install Playwright video runtime
        run: npx playwright install ffmpeg

      - name: Run browser E2E tests
        run: npx playwright test --project=chromium

      - name: Upload Playwright report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  golden-path-database:
    name: Golden Path clean database contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.111.0

      - name: Apply all migrations to fresh local Postgres
        run: supabase db start

      - name: Golden Path PostgreSQL contract
        run: |
          psql --version
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f scripts/golden-path-schema-smoke.sql

      - name: Investment transactional Golden Path
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f scripts/golden-path-transactional-smoke.sql

      - name: Investment participant reinvestment contract
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f scripts/investment-reinvestment-schema-smoke.sql

      - name: Investment Operational Golden Journey
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f scripts/investment-operational-golden-journey.sql

      - name: Manual crypto verification PostgreSQL contract
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f scripts/investment-manual-crypto-verification-smoke.sql

      - name: RLS permission-hoisting contract
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f scripts/rls-permission-hoisting-smoke.sql

      - name: KYC transactional resilience contract
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f scripts/kyc-resilience-schema-smoke.sql

      - name: HTTP security PostgreSQL contract
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f scripts/http-security-schema-smoke.sql

      - name: SECURITY DEFINER exposure PostgreSQL contract
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f scripts/security-definer-exposure-smoke.sql

      - name: SECURITY DEFINER reviewed-body/config PostgreSQL contract
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f scripts/security-definer-authorization-guard-smoke.sql

      - name: Domain event outbox PostgreSQL contract
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f scripts/domain-event-outbox-schema-smoke.sql

      - name: Document and Notification OS PostgreSQL contract
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f scripts/document-notification-os-schema-smoke.sql

      - name: Operations Intelligence PostgreSQL contract
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f scripts/operations-intelligence-schema-smoke.sql

      - name: Recovery migration-baseline normalization contract
        shell: bash
        run: |
          set -euo pipefail
          database_url='postgresql://postgres:postgres@127.0.0.1:54322/postgres'

          # Prove this test actually starts from migration-materialized data, so a
          # green result cannot be obtained by accidentally testing an empty DB.
          baseline_materialized="$(psql "$database_url" -X -qAt -v ON_ERROR_STOP=1 -c "
            select
              (select count(*) from public.investment_beer_styles) >= 4
              and (select count(*) from public.system_notification_templates) >= 2
              and (select count(*) from storage.buckets where id in ('kyc-documents','payment-proofs')) = 2;
          ")"
          test "$baseline_materialized" = 't'

          psql "$database_url" \
            -X -v ON_ERROR_STOP=1 \
            --command "SET ctg.recovery_target = 'local-ephemeral-supabase'" \
            --file scripts/recovery-normalize-local-data.sql

          psql "$database_url" \
            -X -qAt -v ON_ERROR_STOP=1 \
            -f scripts/recovery-database-snapshot.sql \
            > /tmp/recovery-normalized-db.json

          jq -e '
            .authUsers == 0 and
            .profiles == 0 and
            .wallets == 0 and
            .transactions == 0 and
            .kycSubmissions == 0 and
            .kycDocuments == 0 and
            .adminAuditEntries == 0 and
            .storageObjectMetadata == 0 and
            .investmentParticipantProfiles == 0 and
            .investmentFormulaVersions == 0 and
            .investmentBeerStyles == 0 and
            .investmentLots == 0 and
            .investmentOrders == 0 and
            .investmentFundingAllocations == 0 and
            .investmentPaymentReceipts == 0 and
            .investmentLedgerEntries == 0 and
            .investmentSettlements == 0 and
            .investmentSales == 0 and
            .investmentBottleUnits == 0 and
            .investmentWithdrawalRequests == 0 and
            .investmentReinvestmentRequests == 0 and
            .investmentPayouts == 0 and
            .investmentPayoutEvents == 0 and
            .investmentAuditEntries == 0 and
            .domainEvents == 0 and
            .notificationTemplates == 0 and
            .notificationDeliveries == 0 and
            .notificationDeliveryAttempts == 0 and
            .documentJobs == 0 and
            .migrationCount >= 1 and
            (.latestMigration | type == "string")
          ' /tmp/recovery-normalized-db.json >/dev/null

  critical-authenticated-e2e:
    name: Critical authenticated browser journey
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_AUTHENTICATED: "1"
      ALLOW_LOCAL_SUPABASE_CSP: "1"
      PLAYWRIGHT_PORT: "3000"
      NEXT_PUBLIC_SITE_URL: "http://127.0.0.1:3000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.111.0

      - name: Start isolated local Supabase stack
        run: supabase start

      - name: Export isolated Supabase test credentials
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          : "${API_URL:?Local Supabase API_URL missing}"
          : "${ANON_KEY:?Local Supabase ANON_KEY missing}"
          : "${SERVICE_ROLE_KEY:?Local Supabase SERVICE_ROLE_KEY missing}"
          echo "::add-mask::${SERVICE_ROLE_KEY}"
          echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}" >> "$GITHUB_ENV"
          echo "E2E_SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}" >> "$GITHUB_ENV"

      - name: Build Next.js against isolated Supabase
        run: npm run build

      - name: Install pinned Playwright test runtime
        run: npm install --no-save --package-lock=false @playwright/test@1.62.0

      - name: Verify runner Chrome availability
        run: google-chrome --version

      - name: Install Playwright video runtime
        run: npx playwright install ffmpeg

      - name: Run authenticated KYC resilience E2E
        run: npx playwright test tests/e2e/critical-authenticated.spec.mjs --project=chromium

      - name: Upload authenticated E2E report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop isolated local Supabase stack
        if: always()
        run: supabase stop --no-backup

  required-gate:
    name: Test, typecheck and build
    runs-on: ubuntu-latest
    needs: [validate, golden-path-database, critical-authenticated-e2e]
    if: ${{ always() }}
    steps:
      - name: Require complete CI success
        env:
          APPLICATION_RESULT: ${{ needs.validate.result }}
          GOLDEN_PATH_RESULT: ${{ needs.golden-path-database.result }}
          AUTHENTICATED_E2E_RESULT: ${{ needs.critical-authenticated-e2e.result }}
        run: |
          set -euo pipefail
          printf 'application=%s\ngolden_path=%s\nauthenticated_e2e=%s\n' \
            "$APPLICATION_RESULT" "$GOLDEN_PATH_RESULT" "$AUTHENTICATED_E2E_RESULT"
          if [ "$APPLICATION_RESULT" != "success" ] \
            || [ "$GOLDEN_PATH_RESULT" != "success" ] \
            || [ "$AUTHENTICATED_E2E_RESULT" != "success" ]; then
            echo "::error::Required CI gate failed because at least one critical job did not succeed."
            exit 1
          fi
          echo "All critical CI jobs passed; required main-branch gate is satisfied."
