name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enforce PR-only changes to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/commits/${SHA}/pulls")"
          merged_prs="$(printf '%s' "$response" | jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length')"
          if [ "$merged_prs" -lt 1 ]; then
            echo "::error::Direct pushes to main are prohibited. Open a pull request and merge it after CI passes."
            exit 1
          fi
          echo "Main commit is associated with a merged pull request."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Critical safety invariants
        run: npm test

      - name: Production dependency audit
        run: npm run audit:critical

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build Next.js application
        run: npm run build

      - name: Install pinned Playwright test runtime
        run: npm install --no-save --package-lock=false @playwright/test@1.62.0

      - name: Verify runner Chrome availability
        run: google-chrome --version

      - name: Install Playwright video runtime
        run: npx playwright install ffmpeg

      - name: Run browser E2E tests
        run: npx playwright test --project=chromium

      - name: Upload Playwright report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  golden-path-database:
    name: Golden Path clean database contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.111.0

      - name: Apply all migrations to fresh local Postgres
        run: supabase db start

      - name: Golden Path PostgreSQL contract
        run: |
          psql --version
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f scripts/golden-path-schema-smoke.sql
