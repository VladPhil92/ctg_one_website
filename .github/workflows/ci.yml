name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enforce PR-only changes to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/commits/${SHA}/pulls")"
          merged_prs="$(printf '%s' "$response" | jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length')"
          if [ "$merged_prs" -lt 1 ]; then
            echo "::error::Direct pushes to main are prohibited. Open a pull request and merge it after CI passes."
            exit 1
          fi
          echo "Main commit is associated with a merged pull request."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Critical safety invariants
        run: npm test

      - name: Production dependency audit
        run: npm run audit:critical

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build Next.js application
        run: npm run build

      - name: Install pinned Playwright test runtime
        run: npm install --no-save --package-lock=false @playwright/test@1.62.0

      - name: Verify runner Chrome availability
        run: google-chrome --version

      - name: Install Playwright video runtime
        run: npx playwright install ffmpeg

      - name: Run browser E2E tests
        run: npx playwright test --project=chromium

      - name: Upload Playwright report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  golden-path-database:
    name: Golden Path clean database contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.111.0

      - name: Apply all migrations to fresh local Postgres
        run: supabase db start

      - name: Golden Path PostgreSQL contract
        run: |
          psql --version
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f scripts/golden-path-schema-smoke.sql

      - name: Investment transactional Golden Path
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f scripts/golden-path-transactional-smoke.sql

      - name: HTTP security PostgreSQL contract
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f scripts/http-security-schema-smoke.sql

      - name: SECURITY DEFINER exposure PostgreSQL contract
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f scripts/security-definer-exposure-smoke.sql

      - name: SECURITY DEFINER reviewed-body/config PostgreSQL contract
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f scripts/security-definer-authorization-guard-smoke.sql

      - name: KYC transactional resilience PostgreSQL contract
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f scripts/kyc-transactional-resilience-schema-smoke.sql

      - name: Domain event outbox PostgreSQL contract
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f scripts/domain-event-outbox-schema-smoke.sql

      - name: Document and Notification OS PostgreSQL contract
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f scripts/document-notification-os-schema-smoke.sql

      - name: Operations Intelligence PostgreSQL contract
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f scripts/operations-intelligence-schema-smoke.sql

  critical-authenticated-e2e:
    name: Critical authenticated browser journey
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_AUTHENTICATED: "1"
      PLAYWRIGHT_PORT: "3000"
      NEXT_PUBLIC_SITE_URL: "http://127.0.0.1:3000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.111.0

      - name: Start isolated local Supabase stack
        run: supabase start

      - name: Export local public Supabase credentials
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          : "${API_URL:?Local Supabase API_URL missing}"
          : "${ANON_KEY:?Local Supabase ANON_KEY missing}"
          echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}" >> "$GITHUB_ENV"

      - name: Build Next.js against isolated Supabase
        run: npm run build

      - name: Install pinned Playwright test runtime
        run: npm install --no-save --package-lock=false @playwright/test@1.62.0

      - name: Verify runner Chrome availability
        run: google-chrome --version

      - name: Install Playwright video runtime
        run: npx playwright install ffmpeg

      - name: Run authenticated KYC resilience E2E
        run: npx playwright test tests/e2e/critical-authenticated.spec.mjs --project=chromium

      - name: Upload authenticated E2E report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop isolated local Supabase stack
        if: always()
        run: supabase stop --no-backup
