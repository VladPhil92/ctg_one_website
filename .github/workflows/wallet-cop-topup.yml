name: Wallet COP Top-up Trust Boundary

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**wallet_cop_topup**'
      - 'supabase/migrations/**wallet_topup**'
      - 'src/app/api/wallet/deposits/**'
      - 'src/app/api/wallet/payment-qr/**'
      - 'src/app/api/admin/wallet-topups/**'
      - 'src/app/admin/depositos/**'
      - 'src/app/dashboard/depositos/**'
      - 'src/components/admin/WalletTopupReviewQueue.tsx'
      - 'src/lib/payment-instructions.ts'
      - 'src/lib/security/api-rate-limit.ts'
      - 'src/lib/observability/schema-version.ts'
      - 'scripts/test-wallet-cop-topup-invariants.mjs'
      - 'scripts/wallet-cop-topup-smoke.sql'
      - '.github/workflows/wallet-cop-topup.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**wallet_cop_topup**'
      - 'supabase/migrations/**wallet_topup**'
      - 'src/app/api/wallet/deposits/**'
      - 'src/app/api/wallet/payment-qr/**'
      - 'src/app/api/admin/wallet-topups/**'
      - 'src/app/admin/depositos/**'
      - 'src/app/dashboard/depositos/**'
      - 'src/components/admin/WalletTopupReviewQueue.tsx'
      - 'src/lib/payment-instructions.ts'
      - 'src/lib/security/api-rate-limit.ts'
      - 'src/lib/observability/schema-version.ts'
      - 'scripts/test-wallet-cop-topup-invariants.mjs'
      - 'scripts/wallet-cop-topup-smoke.sql'
      - '.github/workflows/wallet-cop-topup.yml'

permissions:
  contents: read

concurrency:
  group: wallet-cop-topup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wallet-cop-topup-contract:
    name: COP top-up financial safety contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify top-up source invariants
        run: |
          node scripts/test-migration-integrity.mjs
          node scripts/test-wallet-shadow-journal-invariants.mjs
          node scripts/test-wallet-cop-topup-invariants.mjs

      - name: Typecheck server and dashboard boundary
        run: npx tsc --noEmit

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.111.0

      - name: Configure isolated database port
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/config.toml')
          source = path.read_text()
          marker = '[db]\n# Port to use for the local database URL.\nport = 54322'
          replacement = '[db]\n# Port to use for the local database URL.\nport = 55437'
          if marker not in source:
            raise SystemExit('Expected Supabase database port stanza was not found')
          path.write_text(source.replace(marker, replacement, 1))
          PY

      - name: Start isolated Supabase database
        run: supabase db start

      - name: COP top-up PostgreSQL golden path
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:55437/postgres" \
            -X -v ON_ERROR_STOP=1 \
            -f scripts/wallet-cop-topup-smoke.sql
