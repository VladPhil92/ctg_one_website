name: Wallet Domain V2 Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**wallet_domain_v2**'
      - 'supabase/migrations/**wallet_intent_creation**'
      - 'supabase/migrations/**wallet_intent_authorization**'
      - 'supabase/migrations/**wallet_canary_execution_guardrails**'
      - 'src/app/api/wallet/intents/**'
      - 'src/lib/wallet/domain.ts'
      - 'src/lib/observability/schema-version.ts'
      - 'scripts/test-wallet-domain-v2-invariants.mjs'
      - 'scripts/wallet-domain-v2-schema-smoke.sql'
      - 'scripts/wallet-intent-authorization-schema-smoke.sql'
      - 'scripts/fixtures/investment-operating-evidence.synthetic-v1.json'
      - 'scripts/fixtures/investment-production-readiness-canary.synthetic-v1.json'
      - '.github/workflows/wallet-domain-v2.yml'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**wallet_domain_v2**'
      - 'supabase/migrations/**wallet_intent_creation**'
      - 'supabase/migrations/**wallet_intent_authorization**'
      - 'supabase/migrations/**wallet_canary_execution_guardrails**'
      - 'src/app/api/wallet/intents/**'
      - 'src/lib/wallet/domain.ts'
      - 'src/lib/observability/schema-version.ts'
      - 'scripts/test-wallet-domain-v2-invariants.mjs'
      - 'scripts/wallet-domain-v2-schema-smoke.sql'
      - 'scripts/wallet-intent-authorization-schema-smoke.sql'
      - 'scripts/fixtures/investment-operating-evidence.synthetic-v1.json'
      - 'scripts/fixtures/investment-production-readiness-canary.synthetic-v1.json'
      - '.github/workflows/wallet-domain-v2.yml'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: wallet-domain-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wallet-domain-v2-contract:
    name: Wallet Domain V2 foundation contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify domain and migration invariants
        run: |
          node scripts/test-migration-integrity.mjs
          node scripts/test-wallet-unification-invariants.mjs
          node scripts/test-wallet-trusted-identity-invariants.mjs
          node scripts/test-wallet-domain-v2-invariants.mjs

      - name: Typecheck Wallet Domain V2
        run: npx tsc --noEmit

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.111.0

      - name: Configure isolated database port
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/config.toml')
          source = path.read_text()
          marker = '[db]\n# Port to use for the local database URL.\nport = 54322'
          replacement = '[db]\n# Port to use for the local database URL.\nport = 55434'
          if marker not in source:
              raise SystemExit('Expected Supabase database port stanza was not found')
          path.write_text(source.replace(marker, replacement, 1))
          PY

      - name: Start isolated Supabase database
        run: supabase db start

      - name: Wallet Domain V2 PostgreSQL contract
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:55434/postgres" \
            -v ON_ERROR_STOP=1 \
            -f scripts/wallet-domain-v2-schema-smoke.sql

      - name: Wallet Intent Authorization V2 + Canary Single-Flight PostgreSQL contract
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:55434/postgres" \
            -v ON_ERROR_STOP=1 \
            -f scripts/wallet-intent-authorization-schema-smoke.sql
