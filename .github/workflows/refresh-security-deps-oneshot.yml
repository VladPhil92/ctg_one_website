name: Security dependency remediation (one-shot branch)
on:
  push:
    branches:
      - security/refresh-ci-vulnerable-dependencies

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Refresh dependency versions and lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --save-exact next@16.4.4 zod@4.6.6
          npm audit fix --package-lock-only --ignore-scripts --omit=dev || true
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix(security): refresh vulnerable Next.js and Zod dependency tree"
            git push origin HEAD:security/refresh-ci-vulnerable-dependencies
          fi
      - name: Verify production security gate
        run: npm audit --omit=dev --audit-level=high
