name: Patch Golden Pale Ale
on:
  push:
    branches: [fix/add-golden-pale-ale]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/add-golden-pale-ale
      - name: Add Golden Pale Ale preset
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/app/admin/operations/page.tsx')
          s=p.read_text()
          needle="const BEER_STYLES = [\n  { id:'irish-red-ale', name:'Irish Red Ale', prefix:'IRA' },"
          repl="const BEER_STYLES = [\n  { id:'golden-pale-ale', name:'Golden Pale Ale', prefix:'GOLD' },\n  { id:'irish-red-ale', name:'Irish Red Ale', prefix:'IRA' },"
          if needle not in s:
              raise SystemExit('BEER_STYLES anchor not found')
          p.write_text(s.replace(needle,repl,1))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/admin/operations/page.tsx
          git commit -m "fix: add Golden Pale Ale lot style"
          git push origin HEAD:fix/add-golden-pale-ale
